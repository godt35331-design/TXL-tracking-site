<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="txlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#txlGrad)"/>
  <!-- Speed dynamic accents -->
  <line x1="10" y1="14" x2="42" y2="14" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="54" y2="50" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- TXL Bold Typography -->
  <text x="32" y="39" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TXL</text>
</svg>